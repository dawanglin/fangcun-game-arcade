<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数和 Kakuro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231c2047'/%3E%3Cpath d='M6 6h5v5H6zM13 6h5v5h-5zM6 13h5v5H6z' fill='%23f5b64c'/%3E%3Cpath d='M13 13h5v5h-5z' fill='%2358d3e8'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0d0f22;--surface:#161935;--surface2:#1c2047;--line:rgba(255,255,255,.1);
    --text:#eef0ff;--muted:#9aa2cc;--amber:#f5b64c;--cyan:#58d3e8;--danger:#ff5d5d;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px 0 30px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 340px at 50% -10%, rgba(88,211,232,.10), transparent 60%)}
  #app{width:min(94vw,440px)}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 12px}
  .brand h1{font-size:22px;font-weight:800}.brand p{font-size:11.5px;color:var(--muted)}
  .score-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 12px;text-align:right}
  .score-box .k{font-size:10px;color:var(--muted)}.score-box b{font-size:16px;font-weight:800;color:var(--amber);cursor:pointer}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
  .board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:var(--surface2);border-radius:12px;padding:8px;max-width:100%}
  .cell{min-width:0;overflow:hidden;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,4.4vw,22px);font-weight:800}
  .cell.black{background:#2a2f55;color:var(--muted);font-size:clamp(10px,3.2vw,14px);font-weight:700;flex-direction:column;line-height:1.15;cursor:default}
  .cell.black em{font-style:normal;color:var(--amber)}
  .cell.white{background:rgba(255,255,255,.06);cursor:pointer}
  .cell.sel{outline:2px solid var(--amber)}
  .cell.err{color:var(--danger)!important;background:rgba(255,93,93,.2)!important}
  .cell.good{color:var(--text)}
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pad button{border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;
    font-size:16px;font-weight:700;padding:10px;border-radius:10px;cursor:pointer}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tools button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;padding:10px;border-radius:10px;cursor:pointer}
  .tip{color:var(--muted);font-size:12px;text-align:center;margin-top:6px;line-height:1.8}
  .overlay{position:fixed;inset:0;display:none;z-index:9;align-items:center;justify-content:center;background:rgba(10,12,30,.86);text-align:center;padding:24px}
  .overlay.show{display:flex}.overlay .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:320px;width:100%}
  .overlay h2{font-size:26px;font-weight:800}.overlay .sub{font-size:13.5px;color:var(--muted);margin:10px 0 16px}
  .btn{width:100%;border:0;cursor:pointer;font-family:inherit;background:var(--amber);color:#20170a;font-size:15px;font-weight:700;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>数和 Kakuro</h1><p>4×4 交叉和 · 小型盘</p></div>
    <div class="score-box"><span class="k">新局</span><b id="newbtn">再来</b></div>
  </header>
  <div class="panel"><div class="board" id="board"></div></div>
  <div class="panel">
    <div class="pad" id="pad"></div>
    <div class="tools"><button id="clear">清除</button><button id="check">检查</button><button id="new">新局</button></div>
    <p class="tip">白格填 1-9：每行/列的提示数 = 该行/列白格数字之和，且同段内不重复</p>
  </div>
</div>
<div class="overlay" id="overlay"><div class="card"><h2 style="color:#57c96b">全部正确！</h2><div class="sub">Kakuro 完成</div><button class="btn" id="restart">再来一局</button></div></div>
<script>
(function(){
  var S=5,W=4,rowSum=[],colSum=[],vals=[],sel=-1;
  function gen(){
    rowSum=[];colSum=[];
    var rows=[];
    for(var i=0;i<W;i++){var r=[];for(var j=0;j<W;j++)r.push(((i*2+j)%4)+1);rows.push(r);}
    // 随机打乱行、列、数字
    function sh(a){for(var i=a.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[k];a[k]=t;}return a;}
    var pr=sh([0,1,2,3]),pc=sh([0,1,2,3]);
    var p=[1,2,3,4];sh(p);
    var b=pr.map(function(i){return pc.map(function(c){return p[rows[i][c]-1];});});
    for(i=0;i<W;i++)rowSum.push(b[i].reduce(function(a,x){return a+x;},0));
    for(var c2=0;c2<W;c2++){var s=0;for(i=0;i<W;i++)s+=b[i][c2];colSum.push(s);}
    vals=[];for(i=0;i<S*S;i++)vals.push(0);
  }
  function render(){
    var el=document.getElementById('board');el.innerHTML='';
    for(var r=0;r<S;r++)for(var c=0;c<S;c++){
      var d=document.createElement('div');
      var black=(r===0||c===0);
      d.className='cell'+(black?' black':' white')+((r*S+c)===sel?' sel':'');
      if(black){
        if(r===0&&c>0){var s=document.createElement('em');s.textContent='↓'+colSum[c-1];d.appendChild(s);}
        if(c===0&&r>0){var s2=document.createElement('em');s2.textContent='→'+rowSum[r-1];d.appendChild(s2);}
        if(r===0&&c===0)d.textContent='';
      }else{
        var v=vals[r*S+c];
        d.textContent=v||'';
        if(v)d.className+=' good';
        (function(rr,cc){d.addEventListener('click',function(){sel=rr*S+cc;render();});})(r,c);
      }
      el.appendChild(d);
    }
  }
  function check(){
    var ok=true,full=true;
    // 行
    for(var r=1;r<S;r++){
      var sum=0,set={};
      for(var c=1;c<S;c++){var v=vals[r*S+c];if(!v){full=false;continue;}sum+=v;if(set[v])ok=false;set[v]=1;}
      if(sum!==rowSum[r-1])ok=false;
    }
    for(var c=1;c<S;c++){
      var sum2=0,set2={};
      for(r=1;r<S;r++){var v2=vals[r*S+c];if(!v2){continue;}sum2+=v2;if(set2[v2])ok=false;set2[v2]=1;}
      if(sum2!==colSum[c-1])ok=false;
    }
    if(!full)return;
    if(ok){document.getElementById('overlay').classList.add('show');}
  }
  function fill(n){
    if(sel<0)return;
    var r=Math.floor(sel/S),c=sel%S;
    if(r===0||c===0)return;
    vals[sel]=n;render();
    if(n)check();
  }
  var pad=document.getElementById('pad');
  for(var n=1;n<=9;n++){(function(v){var b=document.createElement('button');b.textContent=v;
    b.addEventListener('click',function(){fill(v);});pad.appendChild(b);})(n);}
  var eb=document.createElement('button');eb.textContent='×';eb.style.color='var(--danger)';
  eb.addEventListener('click',function(){fill(0);});pad.appendChild(eb);
  document.getElementById('clear').addEventListener('click',function(){fill(0);});
  document.getElementById('check').addEventListener('click',check);
  function reset(){gen();sel=-1;render();}
  document.getElementById('new').addEventListener('click',reset);
  document.getElementById('newbtn').addEventListener('click',reset);
  document.getElementById('restart').addEventListener('click',function(){document.getElementById('overlay').classList.remove('show');reset();});
  reset();
})();
</script>
</body>
</html>
