<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KenKen 肯肯</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231c2047'/%3E%3Cg fill='%2358d3e8'%3E%3Crect x='4' y='4' width='7' height='7' rx='2'/%3E%3Crect x='13' y='13' width='7' height='7' rx='2'/%3E%3C/g%3E%3Cg fill='%23f5b64c'%3E%3Crect x='13' y='4' width='7' height='7' rx='2'/%3E%3Crect x='4' y='13' width='7' height='7' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{--bg:#0d0f22;--surface:#161935;--surface2:#1c2047;--line:rgba(255,255,255,.1);
    --text:#eef0ff;--muted:#9aa2cc;--amber:#f5b64c;--cyan:#58d3e8;--danger:#ff5d5d;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px 0 30px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 340px at 50% -10%, rgba(245,182,76,.10), transparent 60%)}
  #app{width:min(94vw,440px)}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 12px}
  .brand h1{font-size:22px;font-weight:800}.brand p{font-size:11.5px;color:var(--muted)}
  .score-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 12px;text-align:right}
  .score-box .k{font-size:10px;color:var(--muted)}.score-box b{font-size:16px;font-weight:800;color:var(--amber)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--surface2);border-radius:12px;padding:8px;position:relative}
  .cell{position:relative;aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,8vw,34px);font-weight:800;cursor:pointer;color:var(--text);background:rgba(255,255,255,.06)}
  .cell.sel{outline:2px solid var(--amber)}
  .cell.err{color:var(--danger)!important}
  .cell .tgt{position:absolute;top:2px;left:5px;font-size:10.5px;font-weight:700;color:#0d0f22;line-height:1}
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pad button{border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;
    font-size:17px;font-weight:700;padding:11px;border-radius:10px;cursor:pointer}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tools button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;padding:10px;border-radius:10px;cursor:pointer}
  .tip{color:var(--muted);font-size:12px;text-align:center;margin-top:6px;line-height:1.8}
  .overlay{position:fixed;inset:0;display:none;z-index:9;align-items:center;justify-content:center;background:rgba(10,12,30,.86);text-align:center;padding:24px}
  .overlay.show{display:flex}.overlay .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:320px;width:100%}
  .overlay h2{font-size:26px;font-weight:800}.overlay .sub{font-size:13.5px;color:var(--muted);margin:10px 0 16px}
  .btn{width:100%;border:0;cursor:pointer;font-family:inherit;background:var(--amber);color:#20170a;font-size:15px;font-weight:700;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>KenKen 肯肯</h1><p>4×4 算术填数</p></div>
    <div class="score-box"><span class="k">新局</span><b id="newbtn" style="cursor:pointer">再来</b></div>
  </header>
  <div class="panel"><div class="board" id="board"></div></div>
  <div class="panel">
    <div class="pad" id="pad"></div>
    <div class="tools"><button id="clear">清除</button><button id="check">检查</button><button id="new">新局</button></div>
    <p class="tip">每行每列填 1-4 不重复；每个笼子的数字按左上角运算得到目标数</p>
  </div>
</div>
<div class="overlay" id="overlay"><div class="card"><h2 style="color:#57c96b">通关！</h2><div class="sub">KenKen 全对</div><button class="btn" id="restart">再来一局</button></div></div>
<script>
(function(){
  var N=4,sol,values,cages,cageOf,target,sel=-1;
  var COLS=['rgba(88,211,232,.34)','rgba(245,182,76,.34)','rgba(123,216,107,.34)','rgba(176,107,255,.34)','rgba(255,138,122,.34)','rgba(255,216,77,.34)','rgba(255,157,157,.34)'];
  function sh(a){for(var i=a.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[k];a[k]=t;}return a;}
  function lat4(){
    var b=[[1,2,3,4],[2,3,4,1],[3,4,1,2],[4,1,2,3]];
    var pr=sh([0,1,2,3]),pc=sh([0,1,2,3]),nr=pr.map(function(i){return pc.map(function(c){return b[i][c];});});
    return nr;
  }
  function nb(i){var r=Math.floor(i/4),c=i%4,o=[];
    if(r>0)o.push(i-4);if(r<3)o.push(i+4);if(c>0)o.push(i-1);if(c<3)o.push(i+1);return o;}
  function partition(){
    var assigned={},cs=[];
    for(var i=0;i<16;i++){
      if(assigned[i])continue;
      var cage=[i];assigned[i]=1;
      var size=1+Math.floor(Math.random()*3);
      while(cage.length<size){
        var cands=[];
        cage.forEach(function(c){nb(c).forEach(function(n){if(!assigned[n]&&cands.indexOf(n)<0)cands.push(n);});});
        if(!cands.length)break;
        var n2=cands[Math.floor(Math.random()*cands.length)];
        cage.push(n2);assigned[n2]=1;
      }
      cs.push(cage);
    }
    return cs;
  }
  function gen(){
    sol=lat4();cages=partition();
    cageOf={};target={};var ci=0;
    cages.forEach(function(cage){var col=COLS[ci++%COLS.length];
      var vals=cage.map(function(i){return sol[Math.floor(i/4)][i%4];});
      var t;
      if(cage.length===1)t=vals[0]+'';
      else if(cage.length===2){if(Math.random()<0.5)t=Math.max(vals[0],vals[1])-Math.min(vals[0],vals[1])+'−';else t=vals[0]+vals[1]+'+';}
      else{t=Math.random()<0.5?vals.reduce(function(a,b){return a+b;},0)+'+':vals.reduce(function(a,b){return a*b;},1)+'×';}
      cage.forEach(function(i){cageOf[i]=cage;target[i]={t:t,col:col,vals:vals,idx:cage.indexOf(i)};});
    });
    values=[];for(var i=0;i<16;i++)values.push(0);
  }
  function render(){
    var el=document.getElementById('board');el.innerHTML='';
    for(var i=0;i<16;i++){
      var d=document.createElement('div');d.className='cell'+(i===sel?' sel':'');
      d.style.background=target[i].col;
      var v=values[i];
      if(v)d.textContent=v;
      if(target[i].idx===0){
        var s=document.createElement('span');s.className='tgt';s.textContent=target[i].t;
        d.appendChild(s);
      }
      (function(ii){d.addEventListener('click',function(){sel=ii;render();});})(i);
      el.appendChild(d);
    }
  }
  function cageOK(cage){
    var sum=0,prod=1,vals=[];
    cage.forEach(function(i){var v=values[i];if(v){sum+=v;prod*=v;vals.push(v);}});
    if(vals.length!==cage.length)return false;
    var t=target[cage[0]].t;
    if(t.indexOf('−')>=0)return Math.max.apply(null,vals)-Math.min.apply(null,vals)===+t.replace('−','');
    if(t.indexOf('+')>=0)return sum===+t.replace('+','');
    if(t.indexOf('×')>=0)return prod===+t.replace('×','');
    return vals[0]===+t;
  }
  function check(){
    var err=false,full=true;
    for(var r=0;r<4;r++)for(var c=0;c<4;c++){
      var v=values[r*4+c],e=document.querySelectorAll('#board .cell')[r*4+c];
      e.classList.remove('err');
      if(!v){full=false;continue;}
      for(var k=0;k<4;k++)if((k!==c&&values[r*4+k]===v)||(k!==r&&values[k*4+c]===v)){e.classList.add('err');err=true;}
    }
    cages.forEach(function(cage){if(cageOK(cage)){var ci=cage[0];document.querySelectorAll('#board .cell')[ci].classList.remove('err');}
      else if(cage.every(function(i){return values[i];})){document.querySelectorAll('#board .cell')[ci].classList.add('err');err=true;}});
    if(full&&!err)document.getElementById('overlay').classList.add('show');
  }
  function fill(n){
    if(sel<0)return;
    values[sel]=n;render();
    if(n)check();
  }
  var pad=document.getElementById('pad');
  for(var n=1;n<=4;n++){(function(v){var b=document.createElement('button');b.textContent=v;
    b.addEventListener('click',function(){fill(v);});pad.appendChild(b);})(n);}
  var eb=document.createElement('button');eb.textContent='×';eb.style.color='var(--danger)';
  eb.addEventListener('click',function(){fill(0);});pad.appendChild(eb);
  document.getElementById('clear').addEventListener('click',function(){fill(0);});
  document.getElementById('check').addEventListener('click',check);
  function reset(){gen();sel=-1;render();}
  document.getElementById('new').addEventListener('click',reset);
  document.getElementById('newbtn').addEventListener('click',reset);
  document.getElementById('restart').addEventListener('click',function(){document.getElementById('overlay').classList.remove('show');reset();});
  reset();
})();
</script>
</body>
</html>
