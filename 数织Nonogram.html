<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数织 Nonogram</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231c2047'/%3E%3Cpath d='M7 12c1 1 3 1 5 0s4-1 5 0' stroke='%23f5b64c' stroke-width='2' fill='none'/%3E%3Cpath d='M7 7c1 1 3 1 5 0s4-1 5 0M7 17c1 1 3 1 5 0s4-1 5 0' stroke='%2358d3e8' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0d0f22;--surface:#161935;--surface2:#1c2047;--line:rgba(255,255,255,.1);
    --text:#eef0ff;--muted:#9aa2cc;--amber:#f5b64c;--cyan:#58d3e8;--danger:#ff5d5d;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:20px 0 30px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 340px at 50% -10%, rgba(88,211,232,.10), transparent 60%)}
  #app{width:min(94vw,480px)}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 12px}
  .brand h1{font-size:22px;font-weight:800}.brand p{font-size:11.5px;color:var(--muted)}
  .score-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 12px;text-align:right}
  .score-box .k{font-size:10px;color:var(--muted)}.score-box b{font-size:16px;font-weight:800;color:var(--amber)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
  .pzl{display:grid;grid-template-columns:34px 1fr;gap:4px}
  .colhints{display:grid;gap:4px;grid-template-rows:repeat(10,1fr)}
  .rowhints{display:grid;gap:4px;grid-template-columns:repeat(10,1fr)}
  .ch{display:flex;justify-content:center;font-size:10px;color:var(--muted);line-height:1.25;text-align:center}
  .rh{display:flex;align-items:center;justify-content:flex-end;font-size:10px;color:var(--muted);line-height:1.25;text-align:right}
  .board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--surface2);border-radius:8px;padding:5px}
  .cell{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05);cursor:pointer}
  .cell.b{background:var(--amber)}
  .cell.x{background:transparent}
  .cell.x::after{content:"×";display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
  .tools{display:flex;gap:8px;margin-top:12px}
  .tools button{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;padding:10px;border-radius:10px;cursor:pointer}
  .tip{color:var(--muted);font-size:12px;text-align:center;margin-top:6px;line-height:1.8}
  .overlay{position:fixed;inset:0;display:none;z-index:9;align-items:center;justify-content:center;background:rgba(10,12,30,.86);text-align:center;padding:24px}
  .overlay.show{display:flex}.overlay .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:320px;width:100%}
  .overlay h2{font-size:26px;font-weight:800}.overlay .sub{font-size:13.5px;color:var(--muted);margin:10px 0 16px}
  .btn{width:100%;border:0;cursor:pointer;font-family:inherit;background:var(--amber);color:#20170a;font-size:15px;font-weight:700;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>数织 Nonogram</h1><p>按行列提示涂格</p></div>
    <div class="score-box"><span class="k">图案</span><b id="pname">-</b></div>
  </header>
  <div class="panel">
    <div class="pzl">
      <div class="colhints" id="colhints"></div>
      <div class="board" id="board"></div>
    </div>
    <div class="rowhints" id="rowhints"></div>
    <div class="tools">
      <button id="new">换一题</button>
      <button id="check">检查</button>
    </div>
    <p class="tip">点击格子循环：空白 → 涂色 → ×。让涂色格符合行/列的数字提示</p>
  </div>
</div>
<div class="overlay" id="overlay"><div class="card"><h2 style="color:#57c96b">画出来了！</h2><div class="sub" id="os">图案完成</div><button class="btn" id="restart">再来一题</button></div></div>
<script>
(function(){
  var PUZZLES=[
    {n:'爱心',d:['.XX..XX.','.XXXXXX.','XXXXXXXX','XXXXXXX.','.XXXXX..','..XXX...','...X....','........']},
    {n:'小房子',d:['...XX...','..XXXX..','.XXXXXX.','XXXXXXXX','..XXXX..','..X..X..','..X..X..','..XXXX..']},
    {n:'树',d:['...XX...','..XXXX..','.XXXXXX.','..XXXX..','.XXXXXX.','XXXXXXXX','..XXXX..','...XX...']},
    {n:'小船',d:['........','....XX..','...XXXX.','..XXXXXX','XXXXXXXX','.XXXXXX.','..XXXX..','........']},
    {n:'笑脸',d:['.XXXXXX.','XX....XX','X..XX..X','X......X','X..XX..X','XX....XX','.XXXXXX.','........']}
  ];
  var cur=0,state,sel=0;
  function hints(d){
    var res=[];
    for(var r=0;r<8;r++){var seg=[],cnt=0;
      for(var c=0;c<8;c++){if(d[r][c]==='X')cnt++;else{if(cnt){seg.push(cnt);cnt=0;}}}
      if(cnt)seg.push(cnt);
      res.push(seg.length?seg.join(' '):'0');
    }
    return res;
  }
  function load(){
    var p=PUZZLES[cur];
    document.getElementById('pname').textContent=p.n;
    state=[];for(var i=0;i<64;i++)state.push(0);
    render();
  }
  function render(){
    var board=document.getElementById('board');board.innerHTML='';
    var hc=document.getElementById('colhints'),hr=document.getElementById('rowhints');
    hc.innerHTML='';hr.innerHTML='';
    var p=PUZZLES[cur].d;
    var ch=hints(cols(p)),rh=hints(p);
    for(var c=0;c<8;c++){var d=document.createElement('div');d.className='ch';d.textContent=ch[c];hc.appendChild(d);}
    for(var r=0;r<8;r++){var d2=document.createElement('div');d2.className='rh';d2.textContent=rh[r];hr.appendChild(d2);}
    for(var i=0;i<64;i++){
      var cell=document.createElement('div');cell.className='cell';
      if(state[i]===1)cell.classList.add('b');
      if(state[i]===2)cell.classList.add('x');
      (function(ii){cell.addEventListener('click',function(){state[ii]=(state[ii]+1)%3;render();});})(i);
      board.appendChild(cell);
    }
  }
  function cols(d){var o=[];for(var c=0;c<8;c++){var s='';for(var r=0;r<8;r++)s+=d[r][c];o.push(s);}return o;}
  function check(){
    var p=PUZZLES[cur].d,target=[];
    for(var r=0;r<8;r++)for(var c=0;c<8;c++)target.push(p[r][c]==='X'?1:0);
    var ok=true;
    for(var i=0;i<64;i++)if((state[i]===1)!==(target[i]===1)){ok=false;break;}
    if(ok){
      document.getElementById('os').textContent='你画出了「'+p.n+'」！';
      document.getElementById('overlay').classList.add('show');
    }
  }
  function next(){cur=(cur+1)%PUZZLES.length;document.getElementById('overlay').classList.remove('show');load();}
  document.getElementById('new').addEventListener('click',next);
  document.getElementById('check').addEventListener('click',check);
  document.getElementById('restart').addEventListener('click',next);
  load();
})();
</script>
</body>
</html>
